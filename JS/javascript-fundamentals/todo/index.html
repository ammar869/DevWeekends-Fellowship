<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>JavaScript Todo App</h1>
        <form id="todo-form">
            <input type="text" id="todo-input" placeholder="Enter a new task..." autocomplete="off">
            <button type="submit">Add Task</button>
        </form>
        <div class="filters">
            <button id="filter-all" class="active">All</button>
            <button id="filter-active">Active</button>
            <button id="filter-completed">Completed</button>
        </div>
        <ul id="todo-list"></ul>
        <div class="stats">
            <span id="task-count">0 tasks remaining</span>
            <button id="clear-completed">Clear Completed</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
